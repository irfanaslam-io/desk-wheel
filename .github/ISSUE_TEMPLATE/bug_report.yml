name: Bug report
description: Something in Desk Wheel doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please don't include private files or screenshots of personal data.
        Security problems: please report them privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I dropped a .heic photo on the wheel and chose PNG, but nothing happened."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click the orange button
        2. Choose …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Desk Wheel?
      options:
        - Microsoft Store
        - Installer from the website (.exe)
        - Mac download (.dmg)
        - Built it myself
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Desk Wheel version
      description: Settings › Updates shows it.
      placeholder: "0.18.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Converting files
        - Screenshots / mark-up
        - Screen recording
        - Clipboard history
        - PDF tools
        - Text recognition (OCR)
        - Markdown reader
        - Updates / installing
        - Something else
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the file type involved, or the error message. The log is in Settings › Advanced › Open (wheel-debug.txt / log files).
