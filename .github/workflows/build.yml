name: build

on:
  push:
    branches: ['**']
    tags: ['v*']          # a version tag (v0.1.0) also publishes the release and the update feed
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the code; the release job alone may publish releases.
permissions:
  contents: read

# Built into the app (see docs/RELEASING.md). Missing secrets just switch the feature off.
env:
  WHEEL_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
  WHEEL_GA_API_SECRET: ${{ secrets.GA_API_SECRET }}

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install ffmpeg, Tesseract and PDFium (for the recipe, OCR and PDF tests)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
          bash scripts/get-pdfium.sh linux-x64
      - name: File associations match FileTypes.json (Windows installer, Store package, Mac app)
        run: python3 scripts/file-associations.py --check
      - name: Core tests
        run: dotnet run --project tests/Wheel.Core.Tests -c Release

  mac:
    # Public repo: macOS runners are free, so the Mac app builds on every push like Windows.
    runs-on: macos-latest   # Apple silicon
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache the bundled ffmpeg (it takes ~15 minutes to build)
        uses: actions/cache@v4
        with:
          path: engines/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Load Desk Wheel's Mac signing identity (keeps permissions across updates; ad-hoc without it)
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGNING_P12" ]; then
            echo "::warning::MAC_SIGNING_P12 isn't set: the Mac app is signed ad hoc, so macOS asks for permissions again after each update."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPASS=$(uuidgen)
          echo "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          # Trust it for code signing on this throwaway runner, so codesign accepts the self-signed certificate.
          security find-certificate -c "Desk Wheel" -p "$KC" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          ID=$(security find-identity -v -p codesigning "$KC" | awk '/Desk Wheel/ {print $2; exit}')
          test -n "$ID" || { security find-identity -p codesigning "$KC"; echo "The signing identity didn't load"; exit 1; }
          echo "WHEEL_SIGN_ID=$ID" >> "$GITHUB_ENV"
          echo "WHEEL_SIGN_SELF=1" >> "$GITHUB_ENV"
          echo "Signing identity: $ID"
      - name: Build DeskWheel.app and the DMG (builds ffmpeg once, runs core tests on macOS first)
        run: |
          brew install cmake pkg-config nasm
          WHEEL_REQUIRE_FFMPEG=1 ./build-mac.sh --dmg
      - name: Check the bundled ffmpeg is LGPL and uses no Homebrew libraries
        run: |
          F=dist/DeskWheel.app/Contents/MacOS/engines/ffmpeg
          test -x "$F" || { echo "ffmpeg is missing from the app"; exit 1; }
          "$F" -hide_banner -L > licence.txt; head -3 licence.txt
          grep -q "Lesser General Public" licence.txt
          "$F" -hide_banner -encoders | grep -E "h264_videotoolbox|libmp3lame|libopus|libvpx-vp9|libaom-av1"
          ! otool -L "$F" | grep -E '/opt/homebrew|/usr/local'
      - name: Self-test the app from the DMG (video, audio, PDF, ZIP with the shipped engines)
        timeout-minutes: 20
        run: |
          hdiutil attach dist/*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/DeskWheel.app/Contents/MacOS/DeskWheel" --self-test "$RUNNER_TEMP/self-test"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: DeskWheel-mac-arm64
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    needs: core-tests
    strategy:
      fail-fast: false   # one failing runtime shouldn't hide the other's result
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download PDFium
        shell: bash
        run: |
          bash scripts/get-pdfium.sh ${{ matrix.rid }}
          bash scripts/get-pdfium.sh win-x64

      - name: Core tests on Windows (paths, drive letters, ffmpeg.exe)
        if: matrix.rid == 'win-x64'
        run: |
          choco install ffmpeg -y --no-progress
          dotnet run --project tests/Wheel.Core.Tests -c Release

      - name: Install Inno Setup (for the installer)
        run: choco install innosetup -y --no-progress

      - name: Build DeskWheel.exe, bundle ffmpeg, make the installer
        shell: pwsh
        env:
          # Microsoft Store identity (Partner Center › Product identity); set as repository variables.
          WHEEL_MSIX_NAME: ${{ vars.MSIX_NAME }}
          WHEEL_MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          WHEEL_MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: ./build.ps1 -Runtime ${{ matrix.rid }} -SkipTests -Installer -Msix

      - name: Install it and self-test (video, audio, PDF, ZIP with the shipped engines)
        timeout-minutes: 20
        if: matrix.rid == 'win-x64'   # the Arm build is tested on an Arm PC below
        shell: pwsh
        run: ./scripts/self-test-installer.ps1 (Get-Item dist/*-win-x64-setup.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: DeskWheel-${{ matrix.rid }}
          path: dist/*-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DeskWheel-${{ matrix.rid }}-store
          path: dist/*.msix

  windows-arm64-test:
    # The Arm build can't run on the x64 build machine, so it's installed and tested on a Windows Arm PC.
    runs-on: windows-11-arm
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: DeskWheel-win-arm64
          path: dist
      - name: Install it and self-test
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/self-test-installer.ps1 (Get-Item dist/*-win-arm64-setup.exe).FullName

  # Publishes a version: installers + the signed update feed, as a GitHub release on the public releases repo.
  # Installed copies of Desk Wheel read .../releases/latest/download/update.json from there.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, windows-arm64-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub release in this repository
    env:
      RELEASES_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tag's message becomes the release notes
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Check the tag matches the app's version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Wheel.App/Wheel.App.csproj)
          [ "$VERSION" = "$APP" ] || { echo "Tag $GITHUB_REF_NAME doesn't match <Version>$APP</Version>"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: What's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made on GitHub keeps its own text; otherwise the tag's message is used.
          if gh release view "v$VERSION" -R "$RELEASES_REPO" --json body -q .body > whats-new.txt 2>/dev/null && [ -s whats-new.txt ]; then
            echo "Using the release's text"
          else
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > whats-new.txt
            [ "$(cat whats-new.txt)" != "$(git log -1 --format=%B)" ] || : > whats-new.txt
          fi
          # Plain text for the in-app update prompt (without the download tables of an earlier run).
          python3 -c "import importlib.util,sys;s=importlib.util.spec_from_file_location('n','scripts/release-notes.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m);print(m.whats_new(open('whats-new.txt').read(),sys.argv[1]))" "$VERSION" | head -c 1500 > notes.txt
          echo "PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)" >> "$GITHUB_ENV"
      - name: Write and sign update.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "Add the UPDATE_SIGNING_KEY secret (docs/RELEASING.md)"; exit 1; }
          umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          mkdir -p out
          cp artifacts/DeskWheel-mac-arm64/*.dmg "out/DeskWheel-$VERSION-mac-arm64.dmg"
          cp artifacts/DeskWheel-win-x64/*-setup.exe out/
          cp artifacts/DeskWheel-win-arm64/*-setup.exe out/
          python3 scripts/make-update-feed.py --version "$VERSION" \
            --base-url "https://github.com/$RELEASES_REPO/releases/download/v$VERSION" \
            --page "https://github.com/$RELEASES_REPO/releases/tag/v$VERSION" \
            --notes "$(cat notes.txt)" --key "$RUNNER_TEMP/key.pem" --out out \
            mac-arm64="out/DeskWheel-$VERSION-mac-arm64.dmg" \
            windows-x64="out/DeskWheel-$VERSION-win-x64-setup.exe" \
            windows-arm64="out/DeskWheel-$VERSION-win-arm64-setup.exe"
          rm -f "$RUNNER_TEMP/key.pem"
      - name: Release notes and checksums
        env:
          STORE_LIVE: ${{ vars.STORE_LIVE }}
        run: |
          python3 scripts/release-notes.py --version "$VERSION" --repo "$RELEASES_REPO" \
            --whats-new whats-new.txt --previous-tag "$PREVIOUS_TAG" --dir out --out release-notes.md \
            $([ "$STORE_LIVE" = true ] && echo --store-live)
          cat release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(out/*.dmg out/*-setup.exe out/SHA256SUMS.txt out/update.json out/update.json.sig)
          if gh release view "v$VERSION" -R "$RELEASES_REPO" >/dev/null 2>&1; then
            # Made by hand on GitHub (Releases › Draft a new release): add the files and the standard notes.
            gh release upload "v$VERSION" -R "$RELEASES_REPO" --clobber "${files[@]}"
            gh release edit "v$VERSION" -R "$RELEASES_REPO" --title "Desk Wheel $VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" -R "$RELEASES_REPO" --title "Desk Wheel $VERSION" --notes-file release-notes.md "${files[@]}"
          fi
